<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Counter and Addition</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#f8fafc;font:16px Arial;padding:24px}.panel{width:min(520px,100%);background:#151d31;border:1px solid #334155;border-radius:18px;padding:28px}h1{color:#c4b5fd}section{padding:18px 0;border-top:1px solid #334155}button{padding:10px 16px;border:0;border-radius:8px;background:#7c3aed;color:white;cursor:pointer;margin:4px}input{width:100px;padding:10px;border-radius:8px;border:1px solid #64748b;background:#0b1020;color:white}#count{font-size:2rem;font-weight:bold;color:#a7f3d0}</style></head><body><main class="panel"><h1>Increment, Decrement & Addition</h1><section><h2>Counter</h2><p id="count">0</p><button id="inc">Increment +</button><button id="dec">Decrement −</button><button id="reset">Reset</button></section><section><h2>Add two numbers</h2><input type="number" id="first" value="12" aria-label="First number"> + <input type="number" id="second" value="45" aria-label="Second number"><button id="add">Addition</button><p id="result" aria-live="polite">Result: 57</p></section></main><script>let count=0;const display=document.getElementById('count');function render(){display.textContent=count;}document.getElementById('inc').onclick=()=>{count++;render();};document.getElementById('dec').onclick=()=>{count--;render();};document.getElementById('reset').onclick=()=>{count=0;render();};document.getElementById('add').onclick=()=>{const a=Number(document.getElementById('first').value);const b=Number(document.getElementById('second').value);document.getElementById('result').textContent='Result: '+(a+b);};</script></body></html>
