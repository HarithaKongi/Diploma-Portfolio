<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Changer</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080b14;color:#f8fafc;font:16px Arial,sans-serif;display:grid;place-items:center;padding:24px}.panel{width:min(440px,100%);padding:32px;border:1px solid #263247;border-radius:22px;background:#111827;text-align:center;box-shadow:0 20px 60px #0006}h1{margin-top:0}.preview{height:190px;border-radius:18px;background:#fff;margin:24px 0;border:4px solid #ffffff20;transition:background .2s}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #475569}input{width:65%;background:#0b1220;color:white}button{background:#7c3aed;color:white;border:0;cursor:pointer}#message{color:#a5b4fc;min-height:20px}</style></head><body><main class="panel"><h1>Color Changer</h1><p>Type a CSS color name or value to change the box.</p><div class="preview" id="box" aria-label="Color preview"></div><form id="colorForm"><input id="colorInput" placeholder="e.g. coral, #22c55e" aria-label="Enter a color" required><button>Apply</button></form><p id="message" aria-live="polite">Try a color like skyblue or tomato.</p></main><script>const box=document.getElementById('box');const input=document.getElementById('colorInput');const message=document.getElementById('message');document.getElementById('colorForm').addEventListener('submit',e=>{e.preventDefault();const color=input.value.trim();if(CSS.supports('color',color)){box.style.backgroundColor=color;message.textContent='Applied: '+color;}else{message.textContent='That does not look like a valid CSS color. Try again.';}});</script></body></html>
