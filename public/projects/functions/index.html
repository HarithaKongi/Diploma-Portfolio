<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JavaScript Functions Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e5e7eb;font:16px Arial;padding:32px}.wrap{max-width:760px;margin:auto}h1{text-align:center;color:#c4b5fd}.card{background:#151d31;border:1px solid #334155;border-radius:14px;padding:20px;margin:16px 0}button{background:#7c3aed;color:white;border:0;padding:10px 15px;border-radius:8px;cursor:pointer}output{display:block;color:#a7f3d0;margin-top:12px;min-height:20px}</style></head><body><main class="wrap"><h1>JavaScript Functions</h1><p>Explore functions that take parameters, return values, or are assigned to variables.</p><section class="card"><h2>1. Regular function</h2><button id="regular">Run greeting()</button><output id="out1"></output></section><section class="card"><h2>2. Anonymous function</h2><button id="anonymous">Add 12 + 45</button><output id="out2"></output></section><section class="card"><h2>3. Arrow function</h2><button id="arrow">Join two words</button><output id="out3"></output></section><script>function greeting(){return 'Hello! A regular function was executed.';}const add=function(a,b){return a+b;};const join=(a,b)=>a+' '+b;document.getElementById('regular').onclick=()=>document.getElementById('out1').textContent=greeting();document.getElementById('anonymous').onclick=()=>document.getElementById('out2').textContent='Result: '+add(12,45);document.getElementById('arrow').onclick=()=>document.getElementById('out3').textContent=join('Hello','JavaScript');</script></main></body></html>
