<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JavaScript Looping Statements</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e5e7eb;font:16px Arial;padding:30px}.wrap{max-width:760px;margin:auto}h1{color:#c4b5fd;text-align:center}.card{background:#151d31;border:1px solid #334155;border-radius:14px;padding:20px;margin:16px 0}pre{white-space:pre-wrap;color:#a7f3d0;line-height:1.7}</style></head><body><main class="wrap"><h1>Looping Statements</h1><section class="card"><h2>While loop – welcome messages</h2><pre id="while"></pre></section><section class="card"><h2>Count even numbers from 1 to 10</h2><pre id="even"></pre></section><section class="card"><h2>Do-while loop</h2><pre id="do"></pre></section><section class="card"><h2>For loop</h2><pre id="for"></pre></section></main><script>let a=1;let welcome=[];while(a<=5){welcome.push('Welcome to JavaScript');a++;}document.getElementById('while').textContent=welcome.join('\\n');let n=1,evenCount=0;while(n<=10){if(n%2===0)evenCount++;n++;}document.getElementById('even').textContent='There are '+evenCount+' even numbers between 1 and 10.';let x=1,doLines=[];do{doLines.push('do-while iteration '+x);x++;}while(x<=5);document.getElementById('do').textContent=doLines.join('\\n');let b=1,forLines=[];for(;b<=5;b++){forLines.push('Full stack – '+b);}document.getElementById('for').textContent=forLines.join('\\n');</script></body></html>
